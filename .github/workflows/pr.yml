name: Publish builds and VirusTotal scan

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".editorconfig"
      - ".gitignore"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:
  
# Only allow one instance of this workflow to run at a time. If a commit is pushed that triggers this workflow again, the previous instance will be cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTS_DIR: ./artifacts

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SunshineGameFinder/SunshineGameFinder.csproj

      - name: Publish win-x64
        run: >
          dotnet publish SunshineGameFinder/SunshineGameFinder.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o ${{ env.ARTIFACTS_DIR }}/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish SunshineGameFinder/SunshineGameFinder.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -o ${{ env.ARTIFACTS_DIR }}/linux-x64
      
      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            ${{ env.ARTIFACTS_DIR }}/linux-x64/SunshineGameFinder
            ${{ env.ARTIFACTS_DIR }}/win-x64/SunshineGameFinder.exe

      - name: Wait for VirusTotal Analysis
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, json, urllib.request

          api_key = os.environ.get("VT_API_KEY", "")
          analysis_str = os.environ.get("VT_ANALYSIS", "")

          if not analysis_str:
              print("No analysis output found.")
              sys.exit(0)

          entries = [e.strip() for e in analysis_str.split(",") if e.strip()]
          has_threats = False

          for entry in entries:
              filepath, url = entry.split("=", 1)
              filename = os.path.basename(filepath)
              parts = url.rstrip("/").split("/")
              analysis_id = parts[-2] if parts[-1] == "detection" else parts[-1]

              print(f"\n--- Checking VirusTotal analysis for {filename} (ID: {analysis_id}) ---")
              req = urllib.request.Request(
                  f"https://www.virustotal.com/api/v3/analyses/{analysis_id}",
                  headers={"x-apikey": api_key, "User-Agent": "SunshineGameFinder-CI"}
              )

              completed = False
              for attempt in range(1, 46):
                  try:
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())["data"]["attributes"]
                  except Exception as e:
                      print(f"  [Attempt {attempt}/45] Request error: {e}. Retrying in 20s...")
                      time.sleep(20)
                      continue

                  status = data.get("status", "unknown")
                  print(f"  [Attempt {attempt}/45] Status: {status}")

                  if status == "completed":
                      stats = data.get("stats", {})
                      malicious = stats.get("malicious", 0)
                      suspicious = stats.get("suspicious", 0)
                      undetected = stats.get("undetected", 0)
                      harmless = stats.get("harmless", 0)

                      print(f"\nResults for {filename}:")
                      print(f"  Malicious: {malicious} | Suspicious: {suspicious} | Undetected: {undetected} | Harmless: {harmless}")
                      print(f"  Full report: {url}")

                      # Known upstream ClamAV false positive on .NET self-contained single-file bundles
                      # Signature Win.Malware.Aotera-10060486-0 matches standard .NET coreclr/System.Private.CoreLib error strings
                      threats = []
                      results = data.get("results", {})
                      for engine, details in results.items():
                          if details.get("category") in ("malicious", "suspicious"):
                              result_name = details.get("result") or "unknown"
                              if engine == "ClamAV" and "Win.Malware.Aotera" in result_name:
                                  print(f"    - Ignoring known upstream false positive: {engine}: {result_name}")
                                  continue
                              print(f"    - {engine}: {result_name}")
                              threats.append((engine, result_name))

                      if threats:
                          print(f"::error file={filename}::VirusTotal detected threats in {filename} ({len(threats)} detection(s))")
                          has_threats = True
                      else:
                          print(f"Scan passed: 0 actionable detections for {filename}.")
                      completed = True
                      break
                  elif status in ("queued", "in-progress"):
                      time.sleep(20)
                  else:
                      print(f"  Unexpected status '{status}'. Retrying in 20s...")
                      time.sleep(20)

              if not completed:
                  print(f"::error file={filename}::Timed out waiting for VirusTotal analysis to complete.")
                  has_threats = True

          if has_threats:
              print("\nVirusTotal scan detected threats or failed to complete.")
              sys.exit(1)

          print("\nAll VirusTotal scans completed successfully and are clean!")
          EOF